[workspace]
members = [
    "sys", 
    "tools/rk-strings",
    "tools/rk-hexdump",
    "tools/rk-hasher", 
    "tools/rk-dumper", "tools/rk-inject"
]
resolver = "2"

[workspace.dependencies]
clap = { version = "4.6.6", features = ["derive"] }
hex = "0.4.3"  
regex = "1.13.1"
serde_json = "1.0.154"
md-5 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
blake3 = "1.8.7"

goblin = "0.10"   # 版本按需，0.10 是较新的稳定版
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
] }
