[workspace]
members = [
    "tools/rk-strings",
    "tools/rk-hexdump",
    "sys"
]
resolver = "2"

[workspace.dependencies]
clap = { version = "4.6.6", features = ["derive"] }
regex = "1.13.1"
serde_json = "1.0.154"
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
] }